<div class="expenditure-container">
  <c-breadcrumb class="mb-3">
    <c-breadcrumb-item>
      <a routerLink="/dashboard">Dashboard</a>
    </c-breadcrumb-item>
    <c-breadcrumb-item active>School-expenditure</c-breadcrumb-item>
  </c-breadcrumb>

  <div class="expenditures-header">
    <div class="breadcrumb-title">
      <h4>school-expenditure</h4>
      <p>Track and manage school-expenditure</p>
    </div>
  </div>

  <!-- Summary Cards -->
  <div class="expenditure-summary">
    <div class="expenditure-box total">
      <span>Total Expenditure</span>
      <!--  <h3>{{ totalCollection }}</h3>-->
    </div>

    <div class="expenditure-box">
      <span>This Month</span>
      <!--  <h3>{{ totalCash }}</h3>-->
    </div>

    <div class="expenditure-box">
      <span>Todays Expense</span>
      <!--  <h3>{{ totalUPI }}</h3>-->
    </div>
  </div>
  <div class="button-right">
    <button class="btn btn-primary btn-sm">Add Expenditure</button>
  </div>

  <div
    @for
    (item
    of
    filteredExpenditureList;
    track
    $index)
    class="alert alert-info text-center mt-4"
  >
    No expenditure add list found!
  </div>

  <div>
    <div>
      <h5>Add Expenditure List</h5>
    
    </div>

  </div>
